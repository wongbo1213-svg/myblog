<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>子谦美照 · 伯乐子谦</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ===== Gallery Page ===== */
    .gallery-wrapper {
      padding: 48px 0 80px;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .gallery-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .gallery-subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    /* ===== Main Image Stage ===== */
    .gallery-stage {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
    }

    .gallery-main-wrap {
      position: relative;
      width: 100%;
      background: #F0F0F3;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .gallery-main-img {
      width: 100%;
      height: auto;
      display: block;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .gallery-main-img.fading {
      opacity: 0;
    }

    /* ===== Arrow Buttons ===== */
    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
      opacity: 0.55;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .gallery-arrow:hover {
      background: rgba(255, 255, 255, 0.92);
      opacity: 1;
      transform: translateY(-50%) scale(1.08);
    }

    .gallery-arrow-prev { left: 14px; }
    .gallery-arrow-next { right: 14px; }

    /* ===== Counter ===== */
    .gallery-counter {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .gallery-counter .current {
      color: var(--accent);
      font-weight: 700;
    }

    /* ===== Thumbnails ===== */
    .gallery-thumbs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: nowrap;
    }

    .gallery-thumb {
      width: calc((900px - 4 * 10px) / 5);
      max-width: 160px;
      min-width: 52px;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      display: block;
      flex: 1 1 0;
    }

    .gallery-thumb:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    .gallery-thumb.active {
      border-color: var(--accent);
      opacity: 1;
    }

    /* ===== Back Nav ===== */
    .gallery-nav {
      max-width: 900px;
      margin: 48px auto 0;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .gallery-title { font-size: 1.55rem; }

      .gallery-arrow {
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
      }

      .gallery-arrow-prev { left: 8px; }
      .gallery-arrow-next { right: 8px; }

      .gallery-thumbs { gap: 6px; }

      .gallery-thumb {
        border-radius: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== Navigation ===== -->
  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav-brand">伯乐子谦<span class="accent">.</span></a>
      <button class="nav-toggle" aria-label="切换导航菜单">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="projects.html">作品</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== Gallery Content ===== -->
  <main class="gallery-wrapper">
    <div class="container">

      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="面包屑导航">
        <a href="index.html">首页</a>
        <span class="breadcrumb-sep">/</span>
        <a href="projects.html">作品</a>
        <span class="breadcrumb-sep">/</span>
        <span>子谦美照</span>
      </nav>

      <!-- Gallery Title -->
      <div class="gallery-header">
        <h1 class="gallery-title">子谦美照</h1>
        <p class="gallery-subtitle">美女的自我修养</p>
      </div>

      <!-- Main Stage -->
      <div class="gallery-stage">

        <!-- Large Image -->
        <div class="gallery-main-wrap">
          <img
            id="galleryMain"
            class="gallery-main-img"
            src=""
            alt="当前图片"
          />
          <!-- Left Arrow -->
          <button class="gallery-arrow gallery-arrow-prev" id="btnPrev" aria-label="上一张">&#8592;</button>
          <!-- Right Arrow -->
          <button class="gallery-arrow gallery-arrow-next" id="btnNext" aria-label="下一张">&#8594;</button>
        </div>

        <!-- Counter -->
        <p class="gallery-counter">
          <span class="current" id="counterCurrent">1</span>
          <span> / </span>
          <span id="counterTotal">5</span>
        </p>

        <!-- Thumbnails -->
        <div class="gallery-thumbs" id="galleryThumbs"></div>

      </div>

      <!-- Back Navigation -->
      <div class="gallery-nav">
        <a href="projects.html" class="btn btn-secondary">← 返回作品列表</a>
      </div>

    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">© 2024 伯乐子谦 · 用心构建每个像素</span>
        <div class="footer-links">
          <a href="index.html">首页</a>
          <a href="projects.html">作品</a>
          <a href="about.html">关于</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    const images = [
      "images/ziqian-1.jpg",
      "images/ziqian-2.jpg",
      "images/ziqian-3.jpg",
      "images/ziqian-4.jpg",
      "images/ziqian-5.jpg",
    ];

    /* ---- Placeholder URLs (replace images array entries when real files are ready) ---- */
    const placeholders = images.map((_, i) =>
      `https://placehold.co/1200x800/FFE0E8/D14D7E?text=ziqian-${i + 1}`
    );

    /* Use placeholders if the real file doesn't load yet */
    const getSrc = (i) => {
      const real = images[i];
      /* We'll try real path; onerror will swap to placeholder */
      return real;
    };

    let current = 0;
    const total = images.length;

    const mainImg   = document.getElementById("galleryMain");
    const thumbWrap = document.getElementById("galleryThumbs");
    const btnPrev   = document.getElementById("btnPrev");
    const btnNext   = document.getElementById("btnNext");
    const counterCurrent = document.getElementById("counterCurrent");
    const counterTotal   = document.getElementById("counterTotal");

    counterTotal.textContent = total;

    /* ---- Build thumbnails ---- */
    images.forEach((_, i) => {
      const img = document.createElement("img");
      img.className = "gallery-thumb";
      img.src = getSrc(i);
      img.alt = `缩略图 ${i + 1}`;
      img.addEventListener("error", () => { img.src = placeholders[i]; });
      img.addEventListener("click", () => goTo(i));
      thumbWrap.appendChild(img);
    });

    const thumbs = thumbWrap.querySelectorAll(".gallery-thumb");

    /* ---- Navigate ---- */
    function goTo(index) {
      /* Fade out */
      mainImg.classList.add("fading");

      setTimeout(() => {
        current = (index + total) % total;

        /* Update main image */
        mainImg.src = getSrc(current);
        mainImg.alt = `子谦美照 ${current + 1}`;
        mainImg.onerror = () => { mainImg.src = placeholders[current]; };

        /* Update counter */
        counterCurrent.textContent = current + 1;

        /* Update thumbnails */
        thumbs.forEach((t, i) => t.classList.toggle("active", i === current));

        /* Fade in */
        mainImg.classList.remove("fading");
      }, 200);
    }

    /* ---- Initial render ---- */
    goTo(0);

    /* ---- Arrow buttons ---- */
    btnPrev.addEventListener("click", () => goTo(current - 1));
    btnNext.addEventListener("click", () => goTo(current + 1));

    /* ---- Keyboard ---- */
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft")  goTo(current - 1);
      if (e.key === "ArrowRight") goTo(current + 1);
    });

    /* ---- Touch swipe ---- */
    let touchStartX = 0;
    const stage = document.querySelector(".gallery-main-wrap");

    stage.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    stage.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) < 40) return; /* ignore tiny taps */
      if (dx < 0) goTo(current + 1); /* swipe left → next */
      else         goTo(current - 1); /* swipe right → prev */
    }, { passive: true });
  </script>
</body>
</html>
